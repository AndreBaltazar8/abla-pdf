name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: AndreBaltazar8/setup-abla@b21e1290aa49862e7bf187dc84b6b3511f4b571e # v1.0.0
        with:
          version: '0.2.45'
      - name: Unit tests
        run: make test-in-shell COMPILER=ablac
      - name: Generated files through qpdf, poppler, ghostscript and veraPDF
        run: nix-shell -p qpdf poppler-utils verapdf ghostscript --run tools/check-generated.sh
      - name: Whole real fonts
        run: |
          ablac build examples/invoice.ab -o build/invoice
          nix-shell -p qpdf poppler-utils --run tools/check-fonts.sh
      - name: Signatures through pdfsig, openssl and pyHanko
        run: |
          ablac build tools/sign-file.ab -o build/sign-file
          nix-shell -p openssl qpdf poppler-utils 'python3.withPackages(p: [p.pyhanko p.pyhanko-certvalidator])' --run tools/test-signatures.sh
      - name: Corpus from other producers
        run: tools/test-corpus.sh
      - name: Reader over the corpus, and fuzzing
        run: ablac test tests/corpus_test.ab tests/image_test.ab tests/fuzz_test.ab
